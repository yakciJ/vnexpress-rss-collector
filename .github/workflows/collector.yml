name: VNExpress RSS Collector

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

# Lượt sau không chạy chồng lên lượt trước
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Đường dẫn tuyệt đối: Python không tự mở rộng dấu ~
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Model embedding (~470 MB) giữ giữa các lần chạy, khỏi tải lại từ Hugging Face
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-multilingual-e5-small

      - name: Collect articles
        run: python main.py collect

      - name: Refresh engagement
        run: python main.py metrics

      - name: Label topics
        run: python main.py label
